server {
    listen 80;
    listen [::]:80;
    server_name ai.raifirst.si;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/raifirst-ai/acme;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.raifirst.si;
    ssl_certificate /etc/letsencrypt/live/ai.raifirst.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.raifirst.si/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    access_log /var/log/nginx/ai.raifirst.si.access.log;
    error_log /var/log/nginx/ai.raifirst.si.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
